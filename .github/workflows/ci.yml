name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    container: rust:1.89-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_id=$(cargo pkgid --locked)
          version=${package_id##*#}
          version=${version##*@}
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag must match Cargo.toml version: v$version" >&2
            exit 1
          fi
      - name: Install native dependencies and evaluation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libpcsclite-dev libsqlite3-dev libgtk-4-dev dbus dbus-bin
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Evaluate with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test tray protocol on an isolated bus
        run: TIMECLOCK_ISOLATED_BUS=1 timeout 40s dbus-run-session -- cargo test --locked isolated_protocol -- --ignored
      - name: Build release binary
        run: |
          cargo build --locked --release --bin smartcard-timeclock
          target/release/smartcard-timeclock --help
      - name: Package binary and matching source
        run: |
          mkdir -p dist
          tar -czf dist/smartcard-timeclock-linux-x86_64.tar.gz -C target/release smartcard-timeclock -C "$GITHUB_WORKSPACE" LICENSE.txt
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar.gz --prefix=smartcard-timeclock/ HEAD > dist/smartcard-timeclock-source.tar.gz
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: smartcard-timeclock-linux-x86_64
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smartcard-timeclock-linux-x86_64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
